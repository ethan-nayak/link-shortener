<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Shortener</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 0 20px;
    }
    h1 { font-size: 24px; }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin: 10px 0;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #f6821f;
      color: white;
      border: none;
      cursor: pointer;
    }
    #result { margin-top: 20px; font-size: 18px; }
    a { color: #f6821f; }
  </style>
</head>
<body>
  <h1>AI Link Shortener</h1>
  <p>Powered by Cloudflare Workers + Workers AI</p>
  <input type="text" id="urlInput" placeholder="Paste a long URL here..." />
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shorten() {
      const url = document.getElementById('urlInput').value;
      const result = document.getElementById('result');
      result.textContent = 'Generating...';
      try {
        const response = await fetch('https://link-shortener.ethannayak.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await response.json();
        result.innerHTML = `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
      } catch (e) {
        result.textContent = 'Something went wrong. Try again.';
      }
    }
  </script>
</body>
</html>
