<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Link Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: white;
      border-bottom: 1px solid #eee;
    }
    .logo {
      font-size: 18px;
      font-weight: 600;
      color: #f6821f;
    }
    .logo span { color: #111; font-weight: 400; }
    nav { display: flex; gap: 24px; }
    nav a {
      font-size: 14px;
      color: #666;
      text-decoration: none;
      cursor: pointer;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    nav a:hover { color: #111; }
    nav a.active {
      color: #f6821f;
      border-bottom: 2px solid #f6821f;
    }
    main {
      max-width: 660px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .page { display: none; }
    .page.active { display: block; }
    .hero { margin-bottom: 36px; }
    .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .hero p { color: #666; font-size: 15px; }
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .input-row input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      background: white;
    }
    .input-row input:focus { border-color: #f6821f; }
    .input-row button {
      padding: 12px 22px;
      font-size: 15px;
      background: #f6821f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .input-row button:hover { background: #e07218; }
    #result {
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 15px;
      display: none;
    }
    #result a { color: #f6821f; word-break: break-all; }
    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .stats-header h2 { font-size: 20px; font-weight: 600; }
    .refresh {
      font-size: 13px;
      color: #f6821f;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }
    td { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
    tr:last-child td { border-bottom: none; }
    td a { color: #f6821f; text-decoration: none; }
    td a:hover { text-decoration: underline; }
    .badge {
      background: #fff3e8;
      color: #f6821f;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .delete-btn {
      background: none;
      border: 1px solid #eee;
      color: #999;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .delete-btn:hover { border-color: #f00; color: #f00; }
    .empty { color: #999; font-size: 14px; text-align: center; padding: 40px 0; }
    .powered {
      font-size: 12px;
      color: #bbb;
      margin-top: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ai<span>link</span></div>
    <nav>
      <a class="active" onclick="showPage('shorten', this)">Shorten</a>
      <a onclick="showPage('stats', this)">Stats</a>
    </nav>
  </header>

  <main>
    <div id="shorten" class="page active">
      <div class="hero">
        <h1>Shorten any URL</h1>
        <p>AI generates a memorable slug based on the page content.</p>
      </div>
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="Paste a long URL here..." />
        <button onclick="shorten()">Shorten</button>
      </div>
      <div id="result"></div>
      <p class="powered">Powered by Cloudflare Workers + Workers AI</p>
    </div>

    <div id="stats" class="page">
      <div class="stats-header">
        <h2>Link Analytics</h2>
        <button class="refresh" onclick="loadStats()">Refresh</button>
      </div>
      <div id="stats-content"><p class="empty">Loading...</p></div>
    </div>
  </main>

  <script>
    const WORKER = 'https://link-shortener.ethannayak.workers.dev';

    function showPage(name, el) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      el.classList.add('active');
      if (name === 'stats') loadStats();
    }

    async function shorten() {
      const url = document.getElementById('urlInput').value;
      const result = document.getElementById('result');
      result.style.display = 'block';
      result.textContent = 'Generating slug...';
      try {
        const response = await fetch(WORKER, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await response.json();
        result.innerHTML = `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
      } catch (e) {
        result.textContent = 'Something went wrong. Try again.';
      }
    }

    async function loadStats() {
      const el = document.getElementById('stats-content');
      el.innerHTML = '<p class="empty">Loading...</p>';
      try {
        const response = await fetch(`${WORKER}/stats`);
        const links = await response.json();
        if (links.length === 0) {
          el.innerHTML = '<p class="empty">No links yet. Shorten something first.</p>';
          return;
        }
        el.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Slug</th>
                <th>Original URL</th>
                <th>Created</th>
                <th>Clicks</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${links.map(l => `
                <tr>
                  <td><a href="${WORKER}/${l.slug}" target="_blank">${l.slug}</a></td>
                  <td><a href="${l.original_url}" target="_blank">${l.original_url.slice(0, 40)}...</a></td>
                  <td>${new Date(l.created_at).toLocaleDateString()}</td>
                  <td><span class="badge">${l.click_count}</span></td>
                  <td><button class="delete-btn" onclick="deleteLink('${l.slug}')">Delete</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (e) {
        el.innerHTML = '<p class="empty">Failed to load stats.</p>';
      }
    }

    async function deleteLink(slug) {
      if (!confirm(`Delete ${slug}?`)) return;
      await fetch(WORKER, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug })
      });
      loadStats();
    }
  </script>
</body>
</html>
